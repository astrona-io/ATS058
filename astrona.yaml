# Course manifest for ATS058 - eBPF (Cilium Certified Associate).
# Order per section: README, then per module the landing page, the parts with the lab's
# question reading and lab entry right after the part it practises, and the summary.
# The section capstone and the knowledge check close the section. Playgrounds are shown
# by the markers on the landing and summary pages. solution.md is never listed.
---
training:
  id: ATS058
  title: 'CCA: eBPF'
  description: 'Training material for the eBPF domain of the Cilium Certified Associate
    (CCA): how eBPF programs, hooks and maps work in Cilium, what the datapath gains
    from them, and how Cilium compares with iptables and kube-proxy. Each module has
    an ungraded playground and a graded lab, and each section closes with a capstone
    and a knowledge check. Technical content remains draft and the labs are untested.'
  certification:
    name: Cilium Certified Associate
    code: CCA
    provider: CNCF / Linux Foundation
    domain: eBPF
    weight: 10
    competencies:
    - Understand the Role of eBPF in Cilium
    - eBPF Key Benefits
    - eBPF-based Platforms versus IPtables-based Platforms
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
