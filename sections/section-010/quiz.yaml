# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats058-010
course_id: ATS058
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-010
  title: How eBPF Works In Cilium
questions:
- id: ats058-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: State what the eBPF verifier guarantees and what it does not
  source_readings:
  - sections/section-010/module-01/course-01-programs-verifier-and-loading.md
  prompt: A developer submits an eBPF program that allows every connection in the
    cluster. The kernel loads it without an error. What does this show?
  options:
  - id: a
    text: The program is a correct policy, because the verifier checks the intent
      of the administrator.
    explanation: The verifier does not know the intent of the administrator.
  - id: b
    text: The verifier proved that the program is safe to run, and it did not judge
      whether the behavior is wanted.
    explanation: Correct. The verifier proves memory safety and that the program ends.
      It does not check that the program expresses the policy the administrator wants.
  - id: c
    text: The verifier is disabled for programs that Cilium loads.
    explanation: Cilium programs go through the verifier like all others.
  - id: d
    text: The program will be rejected later by the JIT compiler.
    explanation: The JIT compiler translates accepted programs and does not judge
      behavior.
  correct_option: b
  explanation: The verifier proves memory safety and that the program ends. It does
    not check that the program expresses the policy the administrator wants.
- id: ats058-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Name the hooks Cilium uses and what each one can see
  source_readings:
  - sections/section-010/module-01/course-02-hooks-and-maps.md
  prompt: An application connects to the cluster IP of a Service. Cilium must replace
    the cluster IP with a pod address before the application sends any packet. Which
    hook does this?
  options:
  - id: a
    text: The tc ingress hook on the pod interface.
    explanation: A tc program sees finished packets, and by then the connection already
      exists.
  - id: b
    text: The XDP hook in the network driver.
    explanation: XDP handles frames that arrive at the node and does not see the connect
      call of a local process.
  - id: c
    text: The tc egress hook on the node interface.
    explanation: This hook also runs on packets and not on the connect call.
  - id: d
    text: The cgroup socket address hook for `connect`.
    explanation: Correct. The socket address hook runs when the application calls
      connect(), so the program can change the destination before any packet exists.
  correct_option: d
  explanation: The socket address hook runs when the application calls connect(),
    so the program can change the destination before any packet exists.
- id: ats058-010-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what a map is and why its size is fixed
  source_readings:
  - sections/section-010/module-01/course-02-hooks-and-maps.md
  prompt: The Cilium agent cannot add an entry to a map because the map holds its
    maximum number of entries. What is the effect?
  options:
  - id: a
    text: The map grows automatically by allocating more kernel memory.
    explanation: A map has a fixed maximum size set at creation.
  - id: b
    text: The kernel removes the oldest entry of every map type.
    explanation: Only some types, such as LRU hash maps, remove old entries.
  - id: c
    text: The new entry is rejected, so the datapath does not know about the change
      even though the program is fine.
    explanation: Correct. A full map rejects new entries. Maps are sized when they
      are created, so a large cluster needs maps sized for it.
  - id: d
    text: The agent reloads the program with a bigger map in the same step.
    explanation: A full map does not trigger a program reload.
  correct_option: c
  explanation: A full map rejects new entries. Maps are sized when they are created,
    so a large cluster needs maps sized for it.
- id: ats058-010-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare the Service object with the service map
  source_readings:
  - sections/section-010/module-01/course-02-hooks-and-maps.md
  prompt: A request to a Service reaches a pod that was deleted an hour ago. The Kubernetes
    Service object lists only live pods. What do you check first?
  options:
  - id: a
    text: The Deployment replica count.
    explanation: The replica count does not show what the kernel uses.
  - id: b
    text: The service map of the agent on that node, for example with `cilium-dbg
      bpf lb list`.
    explanation: Correct. The programs read the map, not the Service object. If the
      agent stopped updating, the map can hold an old backend list.
  - id: c
    text: The Dockerfile of the application.
    explanation: The image does not decide which backend the datapath selects.
  - id: d
    text: The node kernel version only.
    explanation: The kernel version does not explain a stale backend.
  correct_option: b
  explanation: The programs read the map, not the Service object. If the agent stopped
    updating, the map can hold an old backend list.
- id: ats058-010-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Name the Cilium components and what each one does
  source_readings:
  - sections/section-010/module-02/course-01-agent-endpoints-and-identity.md
  prompt: Which Cilium component runs on every node, watches the Kubernetes API and
    writes the eBPF maps of that node?
  options:
  - id: a
    text: The Cilium operator.
    explanation: The operator runs as a Deployment for cluster-wide tasks.
  - id: b
    text: Hubble Relay.
    explanation: Relay collects flows and does not write the datapath maps.
  - id: c
    text: The Cilium agent.
    explanation: Correct. The agent runs as a DaemonSet and loads programs and writes
      maps on its node.
  - id: d
    text: The CNI plugin binary.
    explanation: The plugin passes pod network requests to the agent and does not
      keep the maps.
  correct_option: c
  explanation: The agent runs as a DaemonSet and loads programs and writes maps on
    its node.
- id: ats058-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what a security identity is and why policy uses it
  source_readings:
  - sections/section-010/module-02/course-01-agent-endpoints-and-identity.md
  prompt: 'A pod labelled `app: shuttle` is replaced and gets a new IP address. A
    policy allows `app: shuttle`. Why does the policy still work?'
  options:
  - id: a
    text: The policy matches the security identity of the labels, and the new pod
      has the same identity.
    explanation: Correct. Cilium maps labels to a numeric identity, and the IP cache
      translates the address of the new pod to that identity.
  - id: b
    text: The agent copies the old IP address to the new pod.
    explanation: Pods get new addresses when they are replaced.
  - id: c
    text: The policy matches the node name.
    explanation: Policy does not select by node name here.
  - id: d
    text: The policy is disabled until the next agent restart.
    explanation: Policy stays enforced.
  correct_option: a
  explanation: Cilium maps labels to a numeric identity, and the IP cache translates
    the address of the new pod to that identity.
- id: ats058-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a policy rule names the pod port and not the Service
    port
  source_readings:
  - sections/section-010/module-02/course-02-policy-and-service-datapath.md
  prompt: The Service `probe` listens on port 80 and forwards to the container port
    8080. A policy rule must allow the `shuttle` pods. Which port does the rule name?
  options:
  - id: a
    text: 80, the Service port.
    explanation: The Service address is translated before the policy check, so port
      80 never matches.
  - id: b
    text: Both 80 and 8080 are required.
    explanation: Only the pod port is matched.
  - id: c
    text: No port, because ports are never part of a rule.
    explanation: A rule can restrict ports.
  - id: d
    text: 8080, the port of the pod.
    explanation: Correct. The destination is translated first, so the policy sees
      the pod address and the pod port.
  correct_option: d
  explanation: The destination is translated first, so the policy sees the pod address
    and the pod port.
- id: ats058-010-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Describe how a policy becomes a verdict on a packet
  source_readings:
  - sections/section-010/module-02/course-02-policy-and-service-datapath.md
  prompt: A `CiliumNetworkPolicy` selects the `probe` pods and allows only `shuttle`.
    What happens to a request from `drifter`?
  options:
  - id: a
    text: It is allowed, because the policy only logs.
    explanation: Once a policy selects the pods, traffic that no rule allows is denied.
  - id: b
    text: It is forwarded to the proxy of every node.
    explanation: A proxy is used only for layer 7 rules.
  - id: c
    text: It is dropped by the tc program on the pod interface, because no policy
      map entry allows its identity.
    explanation: Correct. The agent resolves the policy into entries in the policy
      map of the endpoint. A packet with no matching entry is dropped.
  - id: d
    text: It is queued until the agent restarts.
    explanation: Packets are decided per packet by the program.
  correct_option: c
  explanation: The agent resolves the policy into entries in the policy map of the
    endpoint. A packet with no matching entry is dropped.
- id: ats058-010-q09
  type: single_choice
  difficulty: beginner
  learning_objective: State what a tail call does
  source_readings:
  - sections/section-010/module-01/course-03-program-types-tail-calls-and-bpftool.md
  prompt: The Cilium datapath is split into several eBPF programs. What does a tail
    call do?
  options:
  - id: a
    text: It starts a user space process that finishes the packet.
    explanation: A tail call stays inside the kernel and does not start processes.
  - id: b
    text: It replaces the running program with another program from a program array,
      and it does not return.
    explanation: Correct. The program array map holds the target programs, and the
      kernel limits a chain to 33 tail calls.
  - id: c
    text: It copies the packet to the Hubble Relay.
    explanation: Hubble reads events, and a tail call does not copy packets.
  - id: d
    text: It loads a new program into the kernel with the bpf() call.
    explanation: Loading is done by the agent with the bpf() system call, not by a
      tail call.
  correct_option: b
  explanation: The program array map holds the target programs, and the kernel limits
    a chain to 33 tail calls.
- id: ats058-010-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why traffic keeps flowing when the agent restarts
  source_readings:
  - sections/section-010/module-01/course-03-program-types-tail-calls-and-bpftool.md
  prompt: The Cilium agent pod restarts on a node. Why do existing connections of
    the pods on that node keep working?
  options:
  - id: a
    text: The programs stay attached to their hooks, and the maps are pinned in the
      BPF file system.
    explanation: Correct. The kernel keeps attached programs, and pinned maps keep
      their content.
  - id: b
    text: Kubernetes moves the pods to another node until the agent returns.
    explanation: Pods stay on their node.
  - id: c
    text: The kernel disables policy until the agent is back.
    explanation: Policy stays enforced by the programs that are still attached.
  - id: d
    text: The operator takes over the datapath of the node.
    explanation: The operator does not run a datapath.
  correct_option: a
  explanation: The kernel keeps attached programs, and pinned maps keep their content.
- id: ats058-010-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain BTF and the kernel requirements of Cilium
  source_readings:
  - sections/section-010/module-01/course-04-kernel-requirements-btf-and-compilation.md
  prompt: Two nodes of one cluster run different kernel versions. On one node a Cilium
    feature does not work. What is the first thing to check?
  options:
  - id: a
    text: The number of pods on the node.
    explanation: The pod count does not decide whether the kernel has a feature.
  - id: b
    text: The version of the Helm chart only, because the kernel is irrelevant.
    explanation: Cilium depends on kernel features, so the kernel matters.
  - id: c
    text: The kernel version and the features that the agent of that node detected
      at startup.
    explanation: Correct. The agent probes the kernel of its node and enables only
      what works there.
  - id: d
    text: The name of the node.
    explanation: The node name has no effect on kernel features.
  correct_option: c
  explanation: The agent probes the kernel of its node and enables only what works
    there.
- id: ats058-010-q12
  type: single_choice
  difficulty: beginner
  learning_objective: Name the roles of the operator and the CNI plugin
  source_readings:
  - sections/section-010/module-02/course-03-components-custom-resources-and-cli-tools.md
  prompt: The Cilium operator is stopped for an hour. Which statement describes the
    effect?
  options:
  - id: a
    text: All pod traffic stops immediately.
    explanation: The datapath runs in the kernel and the agent, not in the operator.
  - id: b
    text: Existing traffic keeps flowing, and cluster-wide cleanup and new address
      range allocations stop.
    explanation: Correct. The operator does cluster-wide tasks such as removing unused
      identities and allocating pod ranges.
  - id: c
    text: Policy is no longer enforced.
    explanation: The programs on the nodes enforce policy without the operator.
  - id: d
    text: The agents on all nodes restart.
    explanation: The agents do not depend on the operator to run.
  correct_option: b
  explanation: The operator does cluster-wide tasks such as removing unused identities
    and allocating pod ranges.
- id: ats058-010-q13
  type: single_choice
  difficulty: beginner
  learning_objective: Tell cilium-dbg from the cilium command line interface
  source_readings:
  - sections/section-010/module-02/course-03-components-custom-resources-and-cli-tools.md
  prompt: You want to read the endpoint list of one node. Which tool and where do
    you run it?
  options:
  - id: a
    text: The `cilium` CLI on your own machine, which always shows all nodes.
    explanation: The cilium CLI manages the cluster, and the endpoint list of one
      node comes from its agent.
  - id: b
    text: "`cilium-dbg` on your own machine, outside the cluster."
    explanation: cilium-dbg exists in the agent container.
  - id: c
    text: "`kubectl apply` with a CiliumEndpoint object."
    explanation: The agent owns CiliumEndpoint objects, and applying one does not
      list endpoints.
  - id: d
    text: "`cilium-dbg` inside the agent pod of that node, started with kubectl exec."
    explanation: Correct. cilium-dbg talks to the local agent through a Unix socket.
  correct_option: d
  explanation: cilium-dbg talks to the local agent through a Unix socket.
- id: ats058-010-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain connection tracking in the Cilium datapath
  source_readings:
  - sections/section-010/module-02/course-04-connection-tracking-and-the-pod-to-pod-path.md
  prompt: A policy allows `shuttle` to reach `probe` on port 8080. Why does the policy
    need no extra rule for the replies of `probe`?
  options:
  - id: a
    text: Replies are never checked by any program.
    explanation: Programs process replies too, and they find the stored entry.
  - id: b
    text: Replies are sent through the operator.
    explanation: The operator is not in the packet path.
  - id: c
    text: Replies match the connection tracking entry that the first packet created.
    explanation: Correct. Cilium keeps its own connection tracking table in eBPF maps.
  - id: d
    text: Replies use a different identity that is always allowed.
    explanation: The identity of the reply source does not change the result.
  correct_option: c
  explanation: Cilium keeps its own connection tracking table in eBPF maps.
- id: ats058-010-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare tunnel and native routing
  source_readings:
  - sections/section-010/module-02/course-04-connection-tracking-and-the-pod-to-pod-path.md
  prompt: What must be true before you switch Cilium from tunnel mode to native routing?
  options:
  - id: a
    text: The node network can route the pod address ranges of all nodes.
    explanation: Correct. Native routing sends pod packets without a wrapper, so the
      network must know the pod ranges.
  - id: b
    text: All pods must use host networking.
    explanation: Pods keep their own addresses.
  - id: c
    text: The operator must run on every node.
    explanation: The operator is a Deployment and does not run on every node.
  - id: d
    text: Hubble must be disabled.
    explanation: Hubble has no effect on the routing mode.
  correct_option: a
  explanation: Native routing sends pod packets without a wrapper, so the network
    must know the pod ranges.
- id: ats058-010-q16
  type: single_choice
  difficulty: beginner
  learning_objective: Find the agent of the node of a pod
  source_readings:
  - sections/section-010/module-03/course-01-agent-health-and-endpoints.md
  prompt: You investigate the `probe` pod. Why is `kubectl exec ds/cilium` a risky
    choice?
  options:
  - id: a
    text: It runs the command in all agents and doubles the output.
    explanation: It runs in one pod.
  - id: b
    text: It selects one agent pod, and that agent can be on a different node than
      the pod.
    explanation: Correct. Choose the agent pod that has the same node name as the
      pod you investigate.
  - id: c
    text: It deletes the endpoint list.
    explanation: It only reads.
  - id: d
    text: It only works on the control plane node.
    explanation: It works on any node.
  correct_option: b
  explanation: Choose the agent pod that has the same node name as the pod you investigate.
- id: ats058-010-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Translate an IP address to an identity
  source_readings:
  - sections/section-010/module-03/course-02-ip-cache-and-identities.md
  prompt: Which command shows the security identity that the node uses for a pod IP
    address?
  options:
  - id: a
    text: cilium-dbg bpf lb list
    explanation: This command prints service frontends and backends.
  - id: b
    text: cilium-dbg bpf ct list global
    explanation: This command prints connection tracking entries.
  - id: c
    text: cilium-dbg bpf ipcache get <pod-ip>
    explanation: Correct. The IP cache maps addresses and prefixes to identities.
  - id: d
    text: cilium-dbg map list
    explanation: This command lists maps and does not translate addresses.
  correct_option: c
  explanation: The IP cache maps addresses and prefixes to identities.
- id: ats058-010-q18
  type: single_choice
  difficulty: advanced
  learning_objective: Explain a drop with the policy map
  source_readings:
  - sections/section-010/module-03/course-03-policy-map-and-connection-tracking.md
  prompt: A policy selects `probe` and allows only `shuttle`. `drifter` is dropped.
    Which reads prove the cause without sending traffic?
  options:
  - id: a
    text: Only the logs of the operator.
    explanation: The operator does not decide packets.
  - id: b
    text: The routing mode and the kernel version.
    explanation: Those facts do not show the verdict of the policy.
  - id: c
    text: The Service object and its cluster IP.
    explanation: The Service object does not show policy decisions.
  - id: d
    text: The endpoint list shows ingress enforcement, the IP cache gives the identity
      of `drifter`, and the policy map of `probe` has no entry for that identity.
    explanation: Correct. The packet finds no allow entry in the policy map and the
      program drops it.
  correct_option: d
  explanation: The packet finds no allow entry in the policy map and the program drops
    it.
