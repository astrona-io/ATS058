# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-058-lab-010-cap
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16

bootstrap:
  init:
    - name: install-cilium-and-workloads
      description: Install Cilium and create the example application
      type: file
      source: bootstrap/01-setup.sh


# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: policy-port-fixed
      description: The policy probe-ingress allows the pod port 8080 and keeps the shuttle source
      type: file
      source: validation/validate-policy-port-fixed.sh
      hint: Change the port in probe-ingress from 80 to 8080. Keep the policy; do not delete it.
    - name: shuttle-allowed
      description: The shuttle pod reaches the probe Service
      type: file
      source: validation/validate-shuttle-allowed.sh
      hint: After the port is fixed the policy allows shuttle. Wait a few seconds for the agent to update the policy map.
    - name: drifter-blocked
      description: The drifter pod in outpost cannot reach the probe Service
      type: file
      source: validation/validate-drifter-blocked.sh
      hint: Do not add a rule for outpost.
    - name: evidence-matches-agent
      description: The ConfigMap capstone-evidence matches identities, endpoint ID and service map
      type: file
      source: validation/validate-evidence-matches-agent.sh
      hint: Read the values from the CiliumEndpoint objects and from cilium-dbg bpf lb list.

teardown:
  keepCluster: false
