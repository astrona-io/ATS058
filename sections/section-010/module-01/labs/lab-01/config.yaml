# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-058-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16

bootstrap:
  init:
    - name: install-cilium-and-workloads
      description: Install Cilium and create the example application
      type: file
      source: bootstrap/01-setup.sh


# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: evidence-recorded
      description: The ConfigMap datapath-evidence has the four required keys
      type: file
      source: validation/validate-evidence-recorded.sh
      hint: Create the ConfigMap in starfleet with the keys probe_cluster_ip, probe_backend, agent_pod and service_map.
    - name: service-address-correct
      description: probe_cluster_ip is the real cluster IP of the probe Service
      type: file
      source: validation/validate-service-address-correct.sh
      hint: Read the address with kubectl -n starfleet get service probe.
    - name: backend-address-correct
      description: probe_backend is the real address of the probe pod, with port 8080
      type: file
      source: validation/validate-backend-address-correct.sh
      hint: Read the pod IP with kubectl -n starfleet get pods -l app=probe -o wide and add :8080.
    - name: agent-map-confirms-service
      description: The named agent lists both addresses in its service map
      type: file
      source: validation/validate-agent-map-confirms-service.sh
      hint: Run cilium-dbg bpf lb list inside the Cilium pod you name in agent_pod.
    - name: service-map-name-correct
      description: service_map names the real BPF map that holds IPv4 services
      type: file
      source: validation/validate-service-map-name-correct.sh
      hint: Run cilium-dbg map list inside the agent and look for the map with lb4_services in its name.

teardown:
  keepCluster: false
