# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-058-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16

bootstrap:
  init:
    - name: install-cilium-and-workloads
      description: Install Cilium and create the example application
      type: file
      source: bootstrap/01-setup.sh


# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: probe-pod-ip-recorded
      description: The ConfigMap node-evidence holds the real IP address of the probe pod
      type: file
      source: validation/validate-probe-pod-ip-recorded.sh
      hint: Read the pod IP with kubectl get pod -o wide or from the endpoint list and store it in the key probe_pod_ip.
    - name: probe-endpoint-id-recorded
      description: The ConfigMap node-evidence holds the endpoint ID that the agent gave the probe pod
      type: file
      source: validation/validate-probe-endpoint-id-recorded.sh
      hint: Run cilium-dbg endpoint list in the agent of the probe node and store the endpoint ID in the key probe_endpoint_id.
    - name: probe-identity-recorded
      description: The ConfigMap node-evidence holds the security identity of the probe pod from the IP cache
      type: file
      source: validation/validate-probe-identity-recorded.sh
      hint: Run cilium-dbg bpf ipcache get with the pod IP and store the identity in the key probe_identity.
    - name: agent-pod-recorded
      description: The ConfigMap node-evidence names the agent pod that runs on the node of the probe pod
      type: file
      source: validation/validate-agent-pod-recorded.sh
      hint: Find the node of the probe pod, then the cilium agent pod with the same node name, and store its name in the key agent_pod.

teardown:
  keepCluster: false
