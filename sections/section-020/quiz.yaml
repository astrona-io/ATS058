  title: Benefits Of eBPF In Cilium
questions:
- id: ats058-020-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why a hash map lookup takes constant time and a rule
    chain does not
  source_readings:
  - sections/section-020/module-01/course-01-lookups-and-updates.md
  prompt: How does the cost of finding the backend for a new connection change when
    the number of Services grows from 100 to 10,000?
  options:
  - id: a
    text: Both models cost the same.
    explanation: A rule chain is read in order and grows with the number of rules.
  - id: b
    text: It stays the same with a hash map and grows with a rule chain.
    explanation: Correct. A hash map computes the position from the key. A rule chain
      has no index and is read from the first rule.
  - id: c
    text: It shrinks in a rule chain, because later rules are cached.
    explanation: There is no such caching in a chain.
  - id: d
    text: It grows only with a hash map.
    explanation: A hash map lookup does not depend on the number of entries.
  correct_option: b
  explanation: A hash map computes the position from the key. A rule chain has no
    index and is read from the first rule.
- id: ats058-020-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe how Cilium updates the datapath when a Service changes
  source_readings:
  - sections/section-020/module-01/course-01-lookups-and-updates.md
  prompt: A new pod becomes a backend of the `probe` Service. What does the Cilium
    agent write?
  options:
  - id: a
    text: The whole rule set of the node is rebuilt and loaded.
    explanation: That describes the rule-chain model.
  - id: b
    text: A new kernel module is compiled and loaded.
    explanation: Cilium needs no kernel module.
  - id: c
    text: It reboots the node.
    explanation: No reboot is needed.
  - id: d
    text: Only the new backend entry and the changed backend count, with `bpf()` calls
      on the map.
    explanation: Correct. The agent changes only the affected entries, so other Services
      are not touched.
  correct_option: d
  explanation: The agent changes only the affected entries, so other Services are
    not touched.
- id: ats058-020-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what socket-level load balancing removes from the packet
    path
  source_readings:
  - sections/section-020/module-01/course-02-shorter-packet-paths.md
  prompt: What does socket load balancing remove for a connection from a pod to a
    cluster IP?
  options:
  - id: a
    text: The need for destination NAT on each packet of the connection.
    explanation: Correct. The program replaces the cluster IP at connect(), so packets
      carry the pod address from the first packet.
  - id: b
    text: The need for a network between nodes.
    explanation: The packets still cross the network.
  - id: c
    text: The policy check at the destination pod.
    explanation: Policy is still enforced.
  - id: d
    text: The need for a Service object.
    explanation: The Service object is still the source of the map entry.
  correct_option: a
  explanation: The program replaces the cluster IP at connect(), so packets carry
    the pod address from the first packet.
- id: ats058-020-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Determine which datapath features a node runs
  source_readings:
  - sections/section-020/module-01/course-02-shorter-packet-paths.md
  prompt: Two nodes run the same Cilium version on different kernels. How do you find
    out whether eBPF host routing is active on each?
  options:
  - id: a
    text: Read the Helm values only, because they are the same on both nodes.
    explanation: Cilium can fall back on a node that cannot support a feature.
  - id: b
    text: Read the Dockerfile of the agent image.
    explanation: The image does not show node capabilities.
  - id: c
    text: Read `cilium-dbg status` in the agent of each node.
    explanation: Correct. The agent status shows the features the agent enabled on
      its node, and it can differ between nodes.
  - id: d
    text: Assume the feature is active everywhere.
    explanation: The kernel and the configuration decide.
  correct_option: c
  explanation: The agent status shows the features the agent enabled on its node,
    and it can differ between nodes.
- id: ats058-020-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Name the parts of Hubble and what each does
  source_readings:
  - sections/section-020/module-02/course-01-observability-with-hubble.md
  prompt: What does Hubble Relay do?
  options:
  - id: a
    text: It runs the eBPF programs.
    explanation: The programs run in the kernel.
  - id: b
    text: It stores policy rules.
    explanation: Policy is resolved by the agent.
  - id: c
    text: It replaces the Cilium agent on a node.
    explanation: The agent keeps running.
  - id: d
    text: It connects to the Hubble server of every agent and offers the flows of
      the whole cluster.
    explanation: Correct. The Hubble server in each agent serves one node. Relay combines
      them.
  correct_option: d
  explanation: The Hubble server in each agent serves one node. Relay combines them.
- id: ats058-020-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a Hubble flow and its limits
  source_readings:
  - sections/section-020/module-02/course-01-observability-with-hubble.md
  prompt: "`hubble observe` run in one agent pod does not show a flow that you sent
    a minute ago. What is a likely reason?"
  options:
  - id: a
    text: The flow was sent to a pod on another node, or the ring of recent flows
      already overwrote it.
    explanation: Correct. An agent shows the flows of its own node, and it keeps only
      a limited number of recent flows.
  - id: b
    text: Hubble stores flows only after a node reboot.
    explanation: Flows are served from memory while the agent runs.
  - id: c
    text: Hubble can only show dropped flows.
    explanation: It shows forwarded flows as well.
  - id: d
    text: The Kubernetes API deleted the flow.
    explanation: Flows do not live in the Kubernetes API.
  correct_option: a
  explanation: An agent shows the flows of its own node, and it keeps only a limited
    number of recent flows.
- id: ats058-020-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe what keeps running when the agent restarts
  source_readings:
  - sections/section-020/module-02/course-02-safety-live-updates-and-agent-restart.md
  prompt: The Cilium agent pod on a node restarts. What happens to established connections
    between pods on that node?
  options:
  - id: a
    text: They are all dropped, because the agent owns the datapath.
    explanation: The kernel holds the programs and maps.
  - id: b
    text: Forwarding continues with the programs and maps already in the kernel, and
      changes wait until the agent returns.
    explanation: Correct. The kernel keeps the attached programs and the pinned maps,
      so forwarding continues. New changes are not applied until the agent is back.
  - id: c
    text: The node reboots.
    explanation: No reboot happens.
  - id: d
    text: They continue and new policies also apply immediately.
    explanation: New policy changes need the agent.
  correct_option: b
  explanation: The kernel keeps the attached programs and the pinned maps, so forwarding
    continues. New changes are not applied until the agent is back.
- id: ats058-020-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Enable Hubble on a running cluster
  source_readings:
  - sections/section-020/module-02/course-01-observability-with-hubble.md
  prompt: You run `helm upgrade` with `hubble.enabled=true` and `hubble.relay.enabled=true`
    on a running release. Which option keeps the other settings?
  options:
  - id: a
    text: "`--reuse-values`"
    explanation: Correct. `--reuse-values` keeps the values of the existing release.
      The change restarts the agents.
  - id: b
    text: "`--reset-values`"
    explanation: This resets the release to the chart defaults.
  - id: c
    text: "`--dry-run`"
    explanation: This does not apply the change.
  - id: d
    text: "`--uninstall`"
    explanation: This is not an option of the upgrade command and would remove the
      release.
  correct_option: a
  explanation: "`--reuse-values` keeps the values of the existing release. The change
    restarts the agents."
- id: ats058-020-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the Maglev property
  source_readings:
  - sections/section-020/module-01/course-03-maglev-dsr-and-load-balancing-modes.md
  prompt: Traffic from outside the cluster reaches the same Service through two different
    nodes. Which backend selection property of Maglev helps?
  options:
  - id: a
    text: Both nodes pick the same backend for the same connection without sharing
      state.
    explanation: Correct. Maglev uses a consistent hash of the connection data and
      a lookup table, so nodes that share no state choose the same backend.
  - id: b
    text: The nodes exchange a list of connections over the Kubernetes API.
    explanation: This does not match the reading.
  - id: c
    text: Every node always picks the first backend in the list.
    explanation: This does not match the reading.
  - id: d
    text: The backend is chosen by the client application.
    explanation: This does not match the reading.
  correct_option: a
  explanation: Maglev uses a consistent hash of the connection data and a lookup table,
    so nodes that share no state choose the same backend.
- id: ats058-020-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain direct server return
  source_readings:
  - sections/section-020/module-01/course-03-maglev-dsr-and-load-balancing-modes.md
  prompt: A Service uses `loadBalancer.mode=dsr`. Where does the reply of the backend
    pod go?
  options:
  - id: a
    text: To the Cilium operator.
    explanation: This does not match the reading.
  - id: b
    text: Directly to the client, with the Service address as the source.
    explanation: Correct. In DSR mode the backend node answers the client directly,
      so the reply does not return through the first node.
  - id: c
    text: Back through the first node, which translates it.
    explanation: This does not match the reading.
  - id: d
    text: To the Kubernetes API server.
    explanation: This does not match the reading.
  correct_option: b
  explanation: In DSR mode the backend node answers the client directly, so the reply
    does not return through the first node.
- id: ats058-020-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain what the bandwidth manager enforces
  source_readings:
  - sections/section-020/module-01/course-04-bandwidth-manager-and-measuring-benefits.md
  prompt: 'A pod has the annotation `kubernetes.io/egress-bandwidth: 10M` and the
    bandwidth manager is enabled. What does Cilium enforce?'
  options:
  - id: a
    text: A limit on the memory of the pod.
    explanation: This does not match the reading.
  - id: b
    text: A limit on the number of connections to the pod.
    explanation: This does not match the reading.
  - id: c
    text: A limit on the traffic that leaves the pod.
    explanation: Correct. The bandwidth manager enforces the egress limit, using departure
      times and the fair queueing scheduler. It does not enforce the ingress annotation.
  - id: d
    text: A limit on the traffic that enters the pod.
    explanation: This does not match the reading.
  correct_option: c
  explanation: The bandwidth manager enforces the egress limit, using departure times
    and the fair queueing scheduler. It does not enforce the ingress annotation.
- id: ats058-020-q12
  type: single_choice
  difficulty: beginner
  learning_objective: Apply a fair measurement method
  source_readings:
  - sections/section-020/module-01/course-04-bandwidth-manager-and-measuring-benefits.md
  prompt: You want to show that a setting improves connection time. Which method is
    correct?
  options:
  - id: a
    text: Change three settings at once and run one test.
    explanation: This does not match the reading.
  - id: b
    text: Compare two clusters with different node sizes.
    explanation: This does not match the reading.
  - id: c
    text: Read the documentation and skip the measurement.
    explanation: This does not match the reading.
  - id: d
    text: Change one setting and repeat the same measurement several times.
    explanation: Correct. A fair comparison changes one setting, keeps the conditions
      the same and repeats the measurement to see the spread.
  correct_option: d
  explanation: A fair comparison changes one setting, keeps the conditions the same
    and repeats the measurement to see the spread.
- id: ats058-020-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: State when flows show Layer 7 data
  source_readings:
  - sections/section-020/module-02/course-03-hubble-metrics-ui-and-layer-7-visibility.md
  prompt: Hubble flows show only Layer 3 and Layer 4 data for an HTTP application.
    What is the most likely reason?
  options:
  - id: a
    text: No policy rule sends the traffic through Envoy.
    explanation: Correct. Layer 7 data exists only for traffic that a policy with
      an L7 rule redirects to the Envoy proxy.
  - id: b
    text: Hubble cannot read HTTP.
    explanation: This does not match the reading.
  - id: c
    text: The pod uses port 8080.
    explanation: This does not match the reading.
  - id: d
    text: The Hubble UI is disabled.
    explanation: This does not match the reading.
  correct_option: a
  explanation: Layer 7 data exists only for traffic that a policy with an L7 rule
    redirects to the Envoy proxy.
- id: ats058-020-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose how to enable Hubble metrics
  source_readings:
  - sections/section-020/module-02/course-03-hubble-metrics-ui-and-layer-7-visibility.md
  prompt: Which Helm value selects the Hubble metric groups, such as drop and flow?
  options:
  - id: a
    text: "`bandwidthManager.enabled`"
    explanation: This does not match the reading.
  - id: b
    text: "`hubble.metrics.enabled`"
    explanation: Correct. `hubble.metrics.enabled` takes a list of metric groups.
  - id: c
    text: "`hubble.relay.enabled`"
    explanation: This does not match the reading.
  - id: d
    text: "`hubble.ui.enabled`"
    explanation: This does not match the reading.
  correct_option: b
  explanation: "`hubble.metrics.enabled` takes a list of metric groups."
- id: ats058-020-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain identity-based policy
  source_readings:
  - sections/section-020/module-02/course-04-security-benefits-identity-policy-and-encryption.md
  prompt: A pod that a policy allows restarts and gets a new IP address. What changes
    in the maps?
  options:
  - id: a
    text: The pod loses its identity.
    explanation: This does not match the reading.
  - id: b
    text: The kernel verifier rejects the program.
    explanation: This does not match the reading.
  - id: c
    text: The IP cache map changes and the policy map entry for the identity stays
      the same.
    explanation: Correct. Policy entries refer to identities, and the IP cache map
      translates addresses to identities.
  - id: d
    text: The policy map must be rewritten for the new address.
    explanation: This does not match the reading.
  correct_option: c
  explanation: Policy entries refer to identities, and the IP cache map translates
    addresses to identities.
- id: ats058-020-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare WireGuard and IPsec
  source_readings:
  - sections/section-020/module-02/course-04-security-benefits-identity-policy-and-encryption.md
  prompt: Which statement about Cilium transparent encryption is correct?
  options:
  - id: a
    text: It encrypts traffic between two pods on the same node.
    explanation: This does not match the reading.
  - id: b
    text: It replaces network policy.
    explanation: This does not match the reading.
  - id: c
    text: It works only with IPsec.
    explanation: This does not match the reading.
  - id: d
    text: It encrypts traffic between pods on different nodes and needs no change
      in the application.
    explanation: Correct. Transparent encryption protects node-to-node traffic with
      WireGuard or IPsec. It does not replace policy and does not cover traffic inside
      one node.
  correct_option: d
  explanation: Transparent encryption protects node-to-node traffic with WireGuard
    or IPsec. It does not replace policy and does not cover traffic inside one node.
- id: ats058-020-q17
  type: single_choice
  difficulty: beginner
  learning_objective: Select dropped flows with the Hubble client
  source_readings:
  - sections/section-020/module-03/course-01-hubble-observe-filters.md
  prompt: Which command part selects only dropped flows in the namespace starfleet?
  options:
  - id: a
    text: "`hubble observe --namespace starfleet --verdict DROPPED`"
    explanation: Correct. The `--namespace` and `--verdict` filters together select
      the dropped flows of that namespace.
  - id: b
    text: "`hubble observe --pod starfleet --type trace`"
    explanation: This does not match the reading.
  - id: c
    text: "`hubble status --namespace starfleet`"
    explanation: This does not match the reading.
  - id: d
    text: "`hubble observe --protocol DROPPED`"
    explanation: This does not match the reading.
  correct_option: a
  explanation: The `--namespace` and `--verdict` filters together select the dropped
    flows of that namespace.
- id: ats058-020-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Place Tetragon next to Cilium
  source_readings:
  - sections/section-020/module-03/course-04-tetragon-and-the-ebpf-ecosystem.md
  prompt: A team must record which process opened a sensitive file in a pod. Which
    tool fits?
  options:
  - id: a
    text: The Hubble UI
    explanation: This does not match the reading.
  - id: b
    text: Tetragon with a TracingPolicy
    explanation: Correct. Tetragon observes processes, files and system calls. A CiliumNetworkPolicy
      controls network traffic.
  - id: c
    text: A CiliumNetworkPolicy
    explanation: This does not match the reading.
  - id: d
    text: kube-proxy
    explanation: This does not match the reading.
  correct_option: b
  explanation: Tetragon observes processes, files and system calls. A CiliumNetworkPolicy
    controls network traffic.
