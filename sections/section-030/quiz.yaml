    text: "`hostFirewall.enabled=true`"
    explanation: "This is not what the source says: the choice does not match the mechanism described in the reading."
  - id: c
    text: "`loadBalancer.mode=dsr`"
    explanation: "This is not what the source says: the choice does not match the mechanism described in the reading."
  - id: d
    text: "`policyEnforcementMode=always`"
    explanation: "This is not what the source says: the choice does not match the mechanism described in the reading."
  correct_option: a
  explanation: "`bpf.masquerade=true` moves the translation to an eBPF program, and the agents must restart to read it."
